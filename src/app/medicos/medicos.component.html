<div class="p-4">
    <!-- Cabecera con Título y Botón de Cerrar Sesión -->
    <div class="header-container">
        <div>
            <h2>Portal del Médico</h2>
            <p>Agenda de turnos asignados y control de atención de pacientes.</p>
        </div>
        <p-button label="Cerrar Sesión" icon="pi pi-sign-out" severity="danger" styleClass="p-button-outlined"
            (onClick)="cerrarSesion()">
        </p-button>
    </div>

    <!-- Filtro por fecha-->
     <div class="filtro-fecha">
        <label for="fecha">Fecha:</label>
        <input #inputFecha id="fecha" type="date" [value]="fecha()" (change)="cambiarFecha(inputFecha.value)">
        <p-button label="Ver todos" severity="secondary" size="small" (onClick)="verTodos()"></p-button>
     </div>

    <!-- Tabla de turnos del médico -->
    <p-table [value]="turnos()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Fecha y Hora</th>
                <th>Paciente</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-turno>
            <tr>
                <td>{{ turno.fechaHora | date:'dd/MM/yyyy HH:mm' }}</td>
                <td>{{ turno.nombre }} {{ turno.apellido }}</td>
                <td>{{ turno.estado }}</td>
                <td>
                    @if (turno.estado === 'ACTIVO') {
                        <div class="flex gap-2">
                            <p-button label="Atender" severity="success" size="small"
                                (onClick)="cambiarEstado(turno.idTurno, 'ATENDIDO')">
                            </p-button>
                            <p-button label="Ausente" severity="help" size="small"
                                (onClick)="cambiarEstado(turno.idTurno, 'AUSENTE')">
                            </p-button>
                        </div>
                    }
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
