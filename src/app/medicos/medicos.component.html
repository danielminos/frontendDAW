<div class="p-4">
    <!-- Cabecera con Título y Botón de Cerrar Sesión -->
    <div class="header-container">
        <div>
            <h2>Portal del Médico</h2>
            <p>Agenda de turnos asignados y control de atención de pacientes.</p>
        </div>
        <p-button label="Cerrar Sesión" icon="pi pi-sign-out" severity="danger" styleClass="p-button-outlined"
            (onClick)="cerrarSesion()">
        </p-button>
    </div>

    <!-- Tabla de turnos del médico -->
    <p-table [value]="turnos" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Fecha y Hora</th>
                <th>Paciente</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-turno>
            <tr>
                <td>{{ turno.fechaHora | date:'medium' }}</td>
                <td>{{ turno.nombrePaciente }} {{ turno.apellidoPaciente }}</td>
                <td>{{ turno.estado }}</td>
                <td>
                    <div class="flex gap-2">
                        <p-button label="Atender" severity="success" size="small"
                            (onClick)="cambiarEstado(turno.idTurno, 'ATENDIDO')"
                            [disabled]="turno.estado !== 'PENDIENTE'">
                        </p-button>
                        <p-button label="Ausente" severity="help" size="small"
                            (onClick)="cambiarEstado(turno.idTurno, 'AUSENTE')"
                            [disabled]="turno.estado !== 'PENDIENTE'">
                        </p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
